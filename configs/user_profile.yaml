# Desktop Butler — interest profile
# Weights come from the Project DUCK spec (they sum to 100). Edit freely:
# add/remove keywords or whole areas, then restart the butler.
# Keywords are matched as whole words/phrases, case-insensitive, in the
# title (counts double) and abstract.

